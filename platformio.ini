; =====================================================
; Poseidon Single Pump - PlatformIO project
; Arduino Uno + A4988 (STEP=2, DIR=5, ENABLE=8 opcional)
; =====================================================

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Mismo baud rate que el sistema Poseidon original
monitor_speed = 115200

lib_deps =
    waspinator/AccelStepper@^1.64